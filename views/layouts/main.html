<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>URL Shortener</title>
    <style>
        :root {
            color-scheme: light dark;
            --bg: #f6f7f9;
            --card: #ffffff;
            --text: #1a1d21;
            --muted: #6b7280;
            --border: #e2e5ea;
            --accent: #2563eb;
            --error: #b91c1c;
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --bg: #14171a;
                --card: #1e2227;
                --text: #e8eaed;
                --muted: #9aa0a6;
                --border: #2f343a;
                --accent: #60a5fa;
                --error: #f87171;
            }
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            background: var(--bg);
            color: var(--text);
            font: 16px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        main {
            width: 100%;
            max-width: 520px;
            padding: 32px;
            border: 1px solid var(--border);
            border-radius: 12px;
            background: var(--card);
        }

        h1 { margin: 0 0 4px; font-size: 22px; }
        p.sub { margin: 0 0 24px; color: var(--muted); font-size: 14px; }

        form { display: flex; gap: 8px; flex-wrap: wrap; }

        input[type="url"] {
            flex: 1 1 260px;
            padding: 10px 12px;
            font-size: 15px;
            color: var(--text);
            background: var(--bg);
            border: 1px solid var(--border);
            border-radius: 8px;
        }

        input[type="url"]:focus {
            outline: 2px solid var(--accent);
            outline-offset: 1px;
        }

        button {
            padding: 10px 18px;
            font-size: 15px;
            font-weight: 500;
            color: #fff;
            background: var(--accent);
            border: 0;
            border-radius: 8px;
            cursor: pointer;
        }

        .error {
            margin: 16px 0 0;
            padding: 10px 12px;
            font-size: 14px;
            color: var(--error);
            border: 1px solid var(--error);
            border-radius: 8px;
        }

        .result {
            margin-top: 24px;
            padding-top: 20px;
            border-top: 1px solid var(--border);
        }

        .label { margin: 0 0 4px; font-size: 12px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); }
        .short a { font-size: 18px; font-weight: 600; color: var(--accent); word-break: break-all; }
        .original { margin: 16px 0 0; font-size: 13px; color: var(--muted); word-break: break-all; }
    </style>
</head>
<body>
    {{embed}}
</body>
</html>
