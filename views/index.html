<main>
    <h1>URL Shortener</h1>
    <p class="sub">Paste a long link, get a short one back.</p>

    <form method="POST" action="/">
        <input
            type="url"
            name="url"
            placeholder="https://example.com/very/long/link"
            value="{{ .Input }}"
            required
            autofocus>
        <button type="submit">Shorten</button>
    </form>

    {{ if .Error }}
        <p class="error">{{ .Error }}</p>
    {{ end }}

    {{ if .ShortURL }}
        <div class="result">
            <p class="label">Short URL</p>
            <p class="short"><a href="{{ .ShortURL }}">{{ .ShortURL }}</a></p>
            <p class="original">Points to {{ .Original }}</p>
        </div>
    {{ end }}
</main>
