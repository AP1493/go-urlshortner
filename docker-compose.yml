services:

  redis:
    image: redis:7.2-alpine
    # No host port: only the app talks to Redis, over the compose network.
    expose:
      - "6379"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  postgres:
    image: postgres:16-alpine
    # No host port: reach it with `docker compose exec postgres psql` or an SSH
    # tunnel. Publishing 5432 would expose the database to anything the host's
    # firewall lets through.
    expose:
      - "5432"
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 5

  app:
    build: .
    # HOST_BIND=127.0.0.1 when a reverse proxy fronts the app on the same box.
    ports:
      - "${HOST_BIND:-0.0.0.0}:${HOST_PORT:-3001}:8080"
    env_file:
      - .env
    environment:
      # Falls back to the redis service above. Set REDIS_HOST (and REDIS_TLS)
      # in .env to use ElastiCache instead.
      REDIS_HOST: ${REDIS_HOST:-redis}
      REDIS_PORT: ${REDIS_PORT:-6379}
      APP_ENV: production
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
